exchange:
  name: binance
  sandbox: true

trading:
  dry_run: true
  total_capital: 100
  stake_amount: 5
  max_open_trades: 4
  leverage: 1

symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - EUR/USD
  - GBP/USD
  - XAU/USD

timeframes:
  primary: "4h"
  entry: "1h"

strategies:
  enabled:
    - trend_momentum
    - reversal_context
    - volatility_breakout
  min_confidence: 0.45

gates:
  confluence:
    enabled: false
  risk:
    enabled: true
    max_position_pct: 5.0
    max_daily_loss_pct: 3.0
    blocking: true
  regime:
    enabled: true
    blocking: true
    min_trending_adx: 25
    max_volatile_atr_pct: 4.0
    volatile_min_confidence: 0.75

risk_defaults:
  crypto:   {sl_pct: 10.0, tp_pct: 20.0}
  forex:    {sl_pct: 1.5,  tp_pct: 3.0}
  gold:     {sl_pct: 3.0,  tp_pct: 6.0}

notifications:
  telegram:
    enabled: true
    daily_summary_time: "22:00"

reflection:
  enabled: true
  min_trades_for_analysis: 200        # Under dette: observation-only, ingen auto-apply
  anthropic_model: "claude-opus-4-8"  # Bruges til begge loops

  nightly:
    schedule: "0 2 * * *"             # 02:00 UTC
    lookback_days: 30                 # Analyser trades fra de seneste N dage
    min_trades_per_strategy: 10       # Spring strategi over hvis for få trades

  weekly:
    schedule: "0 3 * * 0"             # Søndag 03:00 UTC
    include_git_diff: true
    include_profiling: true

  research:                           # Phase 5 — Research Layer (Del A)
    enabled: true                     # berig Loop A/B med curated viden + backtest-baseline
    web_search: false                 # slå urllib web-søgning til (best-effort, netværksafhængig)

  confidence_gate:
    auto_apply_threshold: 0.85        # >= dette: auto-applies (hvis n >= min_sample)
    telegram_threshold: 0.65          # >= dette: send til Telegram til godkendelse
    # Under 0.65: kun i rapport, ingen action
    min_sample_for_auto: 30           # Minimum trades-grundlag for auto-apply
    max_change_pct: 0.20              # Auto-apply må max ændre en parameter med 20%

  ab_experiments:
    min_trades_per_arm: 30            # Minimum trades i hvert arm før konklusion
    significance_threshold: 0.10      # Minimum relativ forbedring for "b_wins"

  news_intelligence:                  # Loop C — Phase 4.1
    enabled: true
    schedule: "0 */2 * * *"           # hver 2. time
    horizon_hours: 24                 # evalueringshorisont for shadow signals
    min_confidence: 0.55              # minimum for at gemme shadow signal
    promotion_accuracy: 0.60          # accuracy-grænse for Telegram-alert
    promotion_min_signals: 30         # minimum antal signals for at vurdere promotion
    sources:
      cryptopanic: false
      fear_greed: true
      alpaca: false                   # sæt true hvis ALPACA_API_KEY er i .env
    # Confirmation-hook (Phase 5 feature — byg infrastrukturen, aktiver ikke endnu)
    confirmation_hook:
      enabled: false
      confidence_boost: 0.05          # +5% confidence ved match
      confidence_damp: 0.08           # -8% confidence ved konflikt

  # Hårde grænser — disse parametre kan ALDRIG auto-applies uanset confidence
  protected_parameters:
    - stake_amount
    - leverage
    - max_open_trades
    - sl_pct
    - tp_pct
    - total_capital
